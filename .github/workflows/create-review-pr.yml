name: Create Review PR

on:
  push:
    branches: [main]
    paths:
      - "problems/**/*.py"

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure reviewed branch exists
        run: |
          if ! git ls-remote --heads origin reviewed | grep -q reviewed; then
            git branch reviewed origin/main
            git push origin reviewed
          fi
          git fetch origin reviewed

      - name: Get changed solution files from this push
        id: changed
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          # For the very first push event, 'before' can be all-zero SHA.
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 "$AFTER_SHA")
          fi

          FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'problems/**/*.py' || true)
          if [ -z "$FILES" ]; then
            echo "No solution files changed in this push"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          printf "%s\n" "$FILES" > /tmp/changed_files.txt

      - name: Sync workflows to reviewed branch
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          git checkout reviewed
          git checkout origin/main -- .github/workflows/
          git add .github/workflows/
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync workflows from main"
            git push origin reviewed
          fi
          git checkout main

      - name: Create per-problem PRs
        if: steps.changed.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          while IFS= read -r py_file; do
            # problems/{category}/{problem-code}/solution.py
            dir=$(dirname "$py_file")
            problem_code=$(basename "$dir")
            category=$(echo "$py_file" | cut -d'/' -f2)
            branch_name="review/${problem_code}"

            # 이미 해당 브랜치의 열린 PR이 있는지 확인
            EXISTING=$(gh pr list --base reviewed --head "$branch_name" --state open --json number -q '.[0].number' || true)

            # 기존 PR이 있고 파일 내용이 이미 최신이면 불필요한 force push를 건너뜀
            if [ -n "$EXISTING" ]; then
              git fetch origin "$branch_name":"refs/remotes/origin/$branch_name" 2>/dev/null || true
              main_blob=$(git rev-parse "origin/main:$py_file" 2>/dev/null || true)
              branch_blob=$(git rev-parse "origin/$branch_name:$py_file" 2>/dev/null || true)
              if [ -n "$main_blob" ] && [ "$main_blob" = "$branch_blob" ]; then
                echo "PR #$EXISTING already up to date for $problem_code"
                continue
              fi
            fi

            # reviewed 기준으로 브랜치 생성 → main에서 해당 파일만 가져오기
            git checkout -B "$branch_name" origin/reviewed
            git checkout origin/main -- "$py_file"
            git add "$py_file"
            if git diff --cached --quiet; then
              echo "No diff to commit for $problem_code"
              continue
            fi
            git commit -m "solve: $problem_code"
            git push origin "$branch_name" --force

            # 이미 열린 PR이 있으면 브랜치 업데이트만 하고 PR 생성 스킵
            if [ -n "$EXISTING" ]; then
              echo "PR #$EXISTING updated for $problem_code"
              continue
            fi

            # README에서 메타 정보 추출
            readme="$dir/README.md"
            title="$problem_code"
            difficulty=""
            if [ -f "$readme" ]; then
              title=$(head -1 "$readme" | sed 's/^# //')
              difficulty=$(grep -oP '난이도 \| \K\w+' "$readme" || true)
            fi

            # PR 본문 = README 내용
            pr_body="/tmp/pr_body_${problem_code}.md"
            if [ -f "$readme" ]; then
              cp "$readme" "$pr_body"
            else
              echo "풀이 리뷰" > "$pr_body"
            fi

            # PR 생성
            gh pr create \
              --base reviewed \
              --head "$branch_name" \
              --title "$title" \
              --body-file "$pr_body"

            # 라벨 추가
            PR_NUM=$(gh pr list --base reviewed --head "$branch_name" --state open --json number -q '.[0].number')
            if [ -n "$PR_NUM" ]; then
              if [ -n "$difficulty" ]; then
                lower_diff=$(echo "$difficulty" | tr '[:upper:]' '[:lower:]')
                case "$lower_diff" in
                  easy)   color="00b8a3" ;;
                  medium) color="ffc01e" ;;
                  hard)   color="ff375f" ;;
                  *)      color="cccccc" ;;
                esac
                gh label create "difficulty/$lower_diff" --color "$color" --force 2>/dev/null || true
                gh pr edit "$PR_NUM" --add-label "difficulty/$lower_diff" 2>/dev/null || true
              fi

              gh label create "category/$category" --color "0075ca" --force 2>/dev/null || true
              gh pr edit "$PR_NUM" --add-label "category/$category" 2>/dev/null || true
            fi

            echo "Created PR for $problem_code"
          done < /tmp/changed_files.txt
