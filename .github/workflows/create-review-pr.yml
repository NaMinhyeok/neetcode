name: Create Review PR

on:
  push:
    branches: [main]
    paths:
      - "problems/**/*.py"

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_numbers: ${{ steps.collect.outputs.pr_numbers }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure reviewed branch exists
        run: |
          if ! git ls-remote --heads origin reviewed | grep -q reviewed; then
            git branch reviewed origin/main
            git push origin reviewed
          fi
          git fetch origin reviewed

      - name: Get changed solution files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/reviewed..HEAD -- 'problems/**/*.py' || true)
          if [ -z "$FILES" ]; then
            echo "No solution files changed"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "$FILES" > /tmp/changed_files.txt

      - name: Create per-problem PRs
        id: collect
        if: steps.changed.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMS=""
          while IFS= read -r py_file; do
            # problems/{category}/{problem-code}/solution.py
            dir=$(dirname "$py_file")
            problem_code=$(basename "$dir")
            category=$(echo "$py_file" | cut -d'/' -f2)
            branch_name="review/${problem_code}"

            # 이미 해당 브랜치의 열린 PR이 있으면 스킵
            EXISTING=$(gh pr list --base reviewed --head "$branch_name" --state open --json number -q '.[0].number' || true)
            if [ -n "$EXISTING" ]; then
              echo "PR #$EXISTING already exists for $problem_code, skipping"
              continue
            fi

            # reviewed 기준으로 브랜치 생성 → main에서 해당 파일 + 워크플로우 가져오기
            git checkout -B "$branch_name" origin/reviewed
            git checkout origin/main -- "$py_file"
            git checkout origin/main -- .github/workflows/
            git add "$py_file" .github/workflows/
            git commit -m "solve: $problem_code"
            git push origin "$branch_name" --force

            # README에서 메타 정보 추출
            readme="$dir/README.md"
            title="$problem_code"
            difficulty=""
            if [ -f "$readme" ]; then
              title=$(head -1 "$readme" | sed 's/^# //')
              difficulty=$(grep -oP '난이도 \| \K\w+' "$readme" || true)
            fi

            # PR 본문 = README 내용
            pr_body="/tmp/pr_body_${problem_code}.md"
            if [ -f "$readme" ]; then
              cp "$readme" "$pr_body"
            else
              echo "풀이 리뷰" > "$pr_body"
            fi

            # PR 생성
            gh pr create \
              --base reviewed \
              --head "$branch_name" \
              --title "$title" \
              --body-file "$pr_body"

            # 라벨 추가
            PR_NUM=$(gh pr list --base reviewed --head "$branch_name" --state open --json number -q '.[0].number')
            if [ -n "$PR_NUM" ]; then
              if [ -n "$difficulty" ]; then
                lower_diff=$(echo "$difficulty" | tr '[:upper:]' '[:lower:]')
                case "$lower_diff" in
                  easy)   color="00b8a3" ;;
                  medium) color="ffc01e" ;;
                  hard)   color="ff375f" ;;
                  *)      color="cccccc" ;;
                esac
                gh label create "difficulty/$lower_diff" --color "$color" --force 2>/dev/null || true
                gh pr edit "$PR_NUM" --add-label "difficulty/$lower_diff" 2>/dev/null || true
              fi

              gh label create "category/$category" --color "0075ca" --force 2>/dev/null || true
              gh pr edit "$PR_NUM" --add-label "category/$category" 2>/dev/null || true

              # PR 번호 수집
              PR_NUMS="${PR_NUMS}${PR_NUM},"
            fi

            echo "Created PR for $problem_code"
          done < /tmp/changed_files.txt

          echo "pr_numbers=${PR_NUMS%,}" >> "$GITHUB_OUTPUT"

  review:
    needs: create-pr
    if: needs.create-pr.outputs.pr_numbers != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    strategy:
      matrix:
        pr_number: ${{ fromJson(format('[{0}]', needs.create-pr.outputs.pr_numbers)) }}
      max-parallel: 1

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ matrix.pr_number }}/head
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          pr_number: ${{ matrix.pr_number }}
          prompt: |
            이 PR의 풀이만 리뷰해줘. 다른 PR은 보지 마.

            1. **정확성**: 풀이가 모든 케이스를 올바르게 처리하는지
            2. **시간/공간 복잡도**: Big-O 분석과 최적화 가능 여부
            3. **알고리즘 선택**: 더 효율적인 접근법이 있는지
            4. **엣지 케이스**: 놓친 경계 조건이 있는지
            5. **코드 가독성**: 변수명, 구조, Pythonic한 작성
            6. **학습 포인트**: 이 문제에서 배울 핵심 개념 정리

            한국어로 리뷰해주세요. 리뷰 결과를 이 PR에 코멘트로 작성해줘.
