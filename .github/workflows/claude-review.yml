name: Claude Code Review

on:
  pull_request:
    branches: [reviewed]
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          direct_prompt: |
            이 PR은 알고리즘 문제 풀이입니다. 다음 관점에서 리뷰해주세요:

            1. **정확성**: 풀이가 모든 케이스를 올바르게 처리하는지
            2. **시간/공간 복잡도**: Big-O 분석과 최적화 가능 여부
            3. **알고리즘 선택**: 더 효율적인 접근법이 있는지
            4. **엣지 케이스**: 놓친 경계 조건이 있는지
            5. **코드 가독성**: 변수명, 구조, Pythonic한 작성
            6. **학습 포인트**: 이 문제에서 배울 핵심 개념 정리

            한국어로 리뷰해주세요.
